<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1428;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2b45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051019;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c49a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffd9;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Floating gradient orbs for depth -->
  <circle cx="300" cy="200" r="250" fill="url(#accentGradient)" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1700" cy="900" r="350" fill="url(#accentGradient)" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Grid pattern (tech element) -->
  <g stroke="#00c49a" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="0" x2="0" y2="1080" stroke-dasharray="20,30"/>
    <line x1="120" y1="0" x2="120" y2="1080" stroke-dasharray="20,30"/>
    <line x1="240" y1="0" x2="240" y2="1080" stroke-dasharray="20,30"/>
    <line x1="360" y1="0" x2="360" y2="1080" stroke-dasharray="20,30"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke-dasharray="20,30"/>
    <line x1="600" y1="0" x2="600" y2="1080" stroke-dasharray="20,30"/>
    <line x1="720" y1="0" x2="720" y2="1080" stroke-dasharray="20,30"/>
    <line x1="840" y1="0" x2="840" y2="1080" stroke-dasharray="20,30"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1080" y1="0" x2="1080" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1320" y1="0" x2="1320" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1560" y1="0" x2="1560" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1680" y1="0" x2="1680" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1800" y1="0" x2="1800" y2="1080" stroke-dasharray="20,30"/>
    <line x1="1920" y1="0" x2="1920" y2="1080" stroke-dasharray="20,30"/>
  </g>

  <!-- Simplified world map representing global operations -->
  <g opacity="0.4" fill="none" stroke="#00c49a" stroke-width="1">
    <!-- Continents simplified -->
    <!-- North America -->
    <path d="M 200 300 L 220 280 L 240 290 L 250 320 L 230 340 L 210 330 Z" fill="#00c49a" opacity="0.15"/>
    <!-- South America -->
    <path d="M 240 380 L 260 370 L 270 420 L 250 430 Z" fill="#00c49a" opacity="0.15"/>
    <!-- Europe -->
    <path d="M 550 280 L 580 270 L 590 310 L 570 320 Z" fill="#00c49a" opacity="0.15"/>
    <!-- Africa -->
    <path d="M 600 340 L 650 330 L 660 430 L 620 440 Z" fill="#00c49a" opacity="0.15"/>
    <!-- Asia -->
    <path d="M 700 260 L 800 250 L 820 360 L 750 370 Z" fill="#00c49a" opacity="0.15"/>
    <!-- Australia -->
    <path d="M 900 420 L 930 410 L 940 450 L 910 460 Z" fill="#00c49a" opacity="0.15"/>
  </g>

  <!-- Connection nodes representing global hubs -->
  <g filter="url(#glow)">
    <!-- North America hub (Costa Rica) -->
    <circle cx="220" cy="310" r="8" fill="url(#accentGradient)"/>
    <circle cx="220" cy="310" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>

    <!-- South America hub -->
    <circle cx="250" cy="405" r="8" fill="url(#accentGradient)"/>
    <circle cx="250" cy="405" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>

    <!-- Europe hub (Turkey) -->
    <circle cx="570" cy="300" r="8" fill="url(#accentGradient)"/>
    <circle cx="570" cy="300" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>

    <!-- Africa hub (South Africa) -->
    <circle cx="630" cy="385" r="8" fill="url(#accentGradient)"/>
    <circle cx="630" cy="385" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>

    <!-- Asia SE hub (Philippines, Vietnam) -->
    <circle cx="820" cy="320" r="8" fill="url(#accentGradient)"/>
    <circle cx="820" cy="320" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>

    <!-- South Asia hub (Sri Lanka) -->
    <circle cx="770" cy="350" r="8" fill="url(#accentGradient)"/>
    <circle cx="770" cy="350" r="15" fill="none" stroke="#00c49a" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Connection lines between hubs -->
  <g stroke="#00c49a" stroke-width="1" opacity="0.25" stroke-dasharray="5,5">
    <line x1="220" y1="310" x2="570" y2="300"/>
    <line x1="220" y1="310" x2="250" y2="405"/>
    <line x1="570" y1="300" x2="630" y2="385"/>
    <line x1="630" y1="385" x2="770" y2="350"/>
    <line x1="770" y1="350" x2="820" y2="320"/>
  </g>

  <!-- Team collaboration elements - circles representing diverse team -->
  <g opacity="0.7">
    <!-- Left cluster - diverse team -->
    <circle cx="150" cy="700" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="150" cy="700" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="150" y="710" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">👥</text>

    <circle cx="280" cy="680" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="280" cy="680" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="280" y="690" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">🌍</text>

    <circle cx="150" cy="820" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="150" cy="820" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="150" y="830" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">💼</text>

    <!-- Center cluster - tech/AI -->
    <circle cx="500" cy="750" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="500" cy="750" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="500" y="760" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">⚡</text>

    <circle cx="630" cy="780" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="630" cy="780" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="630" y="790" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">🤖</text>

    <circle cx="500" cy="900" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="500" cy="900" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="500" y="910" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">💡</text>

    <!-- Right cluster - operations -->
    <circle cx="850" cy="700" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="850" cy="700" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="850" y="710" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">📊</text>

    <circle cx="980" cy="720" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="980" cy="720" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="980" y="730" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">🔗</text>

    <circle cx="850" cy="820" r="35" fill="#1a4d2e" stroke="#00c49a" stroke-width="2"/>
    <circle cx="850" cy="820" r="28" fill="#2d5a3d" opacity="0.8"/>
    <text x="850" y="830" font-size="20" fill="#00c49a" text-anchor="middle" font-weight="bold">🌐</text>
  </g>

  <!-- Connection lines between team elements -->
  <g stroke="#00c49a" stroke-width="1" opacity="0.2">
    <line x1="185" y1="700" x2="245" y2="680"/>
    <line x1="185" y1="820" x2="245" y2="680"/>
    <line x1="280" y1="715" x2="465" y2="750"/>
    <line x1="280" y1="715" x2="465" y2="900"/>
    <line x1="535" y1="750" x2="595" y2="780"/>
    <line x1="535" y1="900" x2="595" y2="780"/>
    <line x1="665" y1="780" x2="815" y2="700"/>
    <line x1="665" y1="780" x2="815" y2="820"/>
    <line x1="815" y1="760" x2="945" y2="720"/>
  </g>

  <!-- Data/code elements (tech representation) -->
  <g font-family="monospace" font-size="11" fill="#00c49a" opacity="0.4">
    <text x="1100" y="300">{'const global = 6'}</text>
    <text x="1100" y="330">{'const quality = 98%'}</text>
    <text x="1100" y="360">{'const teams = 200+'}</text>
    <text x="1100" y="390">{'const coverage = 24/7'}</text>

    <text x="1100" y="500">{'[deploy, scale, optimize]'}</text>
    <text x="1100" y="530">{'→ one partner'}</text>
    <text x="1100" y="560">{'→ one contract'}</text>
    <text x="1100" y="590">{'→ one point of'}</text>
    <text x="1100" y="620">{'accountability'}</text>
  </g>

  <!-- Accent lines for premium feel -->
  <g stroke="url(#accentGradient)" stroke-width="2" opacity="0.6">
    <line x1="0" y1="1050" x2="1920" y2="1050"/>
  </g>

  <!-- Subtle animated pulse indicators (will be enhanced with CSS) -->
  <g opacity="0.8">
    <circle cx="220" cy="310" r="3" fill="#00ffd9"/>
    <circle cx="570" cy="300" r="3" fill="#00ffd9"/>
    <circle cx="770" cy="350" r="3" fill="#00ffd9"/>
    <circle cx="820" cy="320" r="3" fill="#00ffd9"/>
  </g>
</svg>
