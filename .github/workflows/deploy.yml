name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep production deploys in one lane. Pull request checks use their own ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Lint → Type-check → Test → Build → Deploy
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for build-time prerendering)
        run: npx playwright install --with-deps chromium

      - name: Type-check (frontend)
        run: npx tsc --noEmit

      - name: Type-check (worker)
        run: npx tsc --noEmit -p tsconfig.worker.json

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check current main before deploying
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          main_ref="$(git ls-remote --exit-code origin refs/heads/main)"
          main_sha="${main_ref%%[[:space:]]*}"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::notice::Skipping deploy because main has advanced."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.release.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify IndexNow (Bing, Yandex, Naver, Seznam, Yep)
        if: steps.release.outputs.current == 'true'
        run: node scripts/indexnow-submit.mjs
