    <style>
        :root {
            /* Light Theme (Default) */
            --cyan: #00C49A;
            --violet: #6366f1;
            --magenta: #c026d3;

            /* Luxury typography and spacing scale */
            --font-body: 'Manrope', sans-serif;
            --font-display: 'Manrope', sans-serif;
            --tracking-display: -0.01em;
            --leading-display: 1.02;
            --space-section-y: clamp(5rem, 9vw, 9rem);
            --space-stack-lg: clamp(1.5rem, 2.5vw, 2.25rem);
            --space-stack-md: clamp(1rem, 1.6vw, 1.4rem);
            
            --background: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --surface: rgba(255, 255, 255, 0.78);
            --border: rgba(15, 23, 42, 0.08);
            
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(15, 23, 42, 0.06);
            --glass-shadow: rgba(15, 23, 42, 0.05);
            
            --btn-bg: #0f172a;
            --btn-text: #ffffff;
        }

        [data-theme="dark"] {
            --background: #020203;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.5);
            
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--text);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* Safe area insets for iPhone notch / home indicator */
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        h1, h2, h3, h4 {
            font-family: var(--font-display);
            letter-spacing: var(--tracking-display);
        }

        .section-shell {
            padding-top: var(--space-section-y);
            padding-bottom: var(--space-section-y);
        }

        .display-hero {
            font-size: clamp(2.75rem, 8vw, 7.25rem) !important;
            letter-spacing: var(--tracking-display);
            line-height: var(--leading-display);
            text-wrap: balance;
        }

        .display-section {
            font-size: clamp(2rem, 5.4vw, 4.5rem) !important;
            letter-spacing: var(--tracking-display);
            line-height: 1.04;
            text-wrap: balance;
        }

        h3 {
            font-size: clamp(1.35rem, 2.6vw, 2.1rem);
            line-height: 1.16;
        }

        h4 {
            font-size: clamp(1.08rem, 1.6vw, 1.35rem);
            line-height: 1.24;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px) saturate(110%);
            -webkit-backdrop-filter: blur(10px) saturate(110%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 28px rgba(15,23,42,0.06), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, var(--border) 1px, transparent 1px),
                linear-gradient(to bottom, var(--border) 1px, transparent 1px);
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 4s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            5% { opacity: 0.5; }
            95% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .glow-pulse {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        
        @keyframes neon-glow-shift {
            0%, 100% {
                box-shadow: 0 0 30px -5px rgba(0, 196, 154, 0.5), 0 0 15px -2px rgba(0, 196, 154, 0.3);
                border-color: rgba(0, 196, 154, 0.4);
            }
            50% {
                box-shadow: 0 0 50px -5px rgba(139, 92, 246, 0.6), 0 0 25px -2px rgba(139, 92, 246, 0.4);
                border-color: rgba(139, 92, 246, 0.5);
            }
        }

        /* hue-rotate-border was removed, filter:hue-rotate() forces GPU
           recompositing on every animation frame and is applied to every hovered
           service card simultaneously. The static gradient below is indistinguishable
           visually and has zero per-frame cost. */

        @keyframes fade-in {
             from { opacity: 0; transform: translateY(10px); }
             to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
        
        .hover-neon-glow {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 1;
            will-change: transform;
        }
        
        .hover-neon-glow::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }
        
        .hover-neon-glow:hover {
            transform: scale(1.03) translateY(-8px);
            animation: neon-glow-shift 4s ease-in-out infinite;
        }
        
        .hover-neon-glow:hover::before {
            /* Static gradient border, replaces hue-rotate-border animation */
            opacity: 1;
        }

        .premium-button {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: var(--btn-bg);
            color: var(--btn-text);
            box-shadow: 0 10px 26px rgba(15,23,42,0.10), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .premium-button::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255,255,255,0.18), transparent 45%, transparent 55%, rgba(255,255,255,0.08));
            transform: translateX(-120%);
            transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
            z-index: -1;
        }

        .premium-button:hover {
            transform: translateY(-1px) scale(1.01);
            box-shadow: 0 16px 36px rgba(15,23,42,0.14), inset 0 1px 0 rgba(255,255,255,0.12);
            filter: none;
        }

        .premium-button:hover::before {
            transform: translateX(120%);
        }

        .premium-button-secondary {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .premium-button-secondary:hover {
            transform: translateY(-1px);
            border-color: rgba(15,23,42,0.18);
            box-shadow: 0 12px 24px rgba(15,23,42,0.08);
        }

        [data-theme="dark"] .premium-button-secondary {
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .premium-button-secondary:hover {
            box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        }

        .service-card-glow {
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            will-change: transform;
        }
        
        .service-card-glow:hover {
            transform: translateY(-5px) scale(1.02);
            animation: neon-glow-shift 3s infinite ease-in-out;
            border-color: rgba(0, 196, 154, 0.5);
        }

        .micro-lift-card {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.3s ease;
            transform-origin: center;
        }

        .micro-lift-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.13), 0 0 0 1px rgba(0,196,154,0.08) inset;
        }

        .luxury-panel {
            position: relative;
            overflow: hidden;
        }

        .luxury-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0) 72%);
            opacity: 0.9;
        }

        [data-theme="light"] .luxury-panel::after {
            opacity: 0.75;
        }

        [data-theme="dark"] .micro-lift-card:hover {
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
        }

        .micro-press-button {
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .micro-press-button:active {
            transform: translateY(1px) scale(0.99);
        }

        .choreo-bridge {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 1rem;
            opacity: 0.9;
        }

        .choreo-label {
            font-family: var(--font-body);
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .choreo-line-track {
            position: relative;
            height: 1px;
            background: var(--border);
            overflow: hidden;
        }

        .choreo-line-fill {
            width: 100%;
            height: 100%;
            transform-origin: left center;
            background: linear-gradient(90deg, transparent, rgba(15,23,42,0.55), transparent);
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .choreo-bridge {
                grid-template-columns: 1fr;
                gap: 0.55rem;
            }
        }

        .text-gradient {
            background: linear-gradient(to right, var(--text), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--background);
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1e2e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--violet);
        }
        .dashed-border {
            background-image: linear-gradient(to right, rgba(255,255,255,0.2) 50%, transparent 50%);
            background-position: bottom;
            background-size: 10px 1px;
            background-repeat: repeat-x;
        }

        /* Digital Glitch Effect - Refined */
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .glitch-text:hover::before,
        .glitch-text:hover::after {
            opacity: 1;
        }

        .glitch-text:hover::before {
            color: var(--cyan);
            z-index: -1;
            animation: glitch-anim-1 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            left: -2px;
            text-shadow: 2px 0 var(--magenta);
        }
        
        .glitch-text:hover::after {
            color: var(--magenta);
            z-index: -2;
            animation: glitch-anim-2 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite reverse;
            left: 2px;
            text-shadow: -2px 0 var(--cyan);
        }
        
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-4px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(4px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-4px, -2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(4px, 2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-4px, 2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translate(4px, -2px); }
        }
        
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, -1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-4px, 2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(4px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-4px, -1px); }
            80% { clip-path: inset(60% 0 30% 0); transform: translate(4px, 1px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-4px, -2px); }
        }
        /* Disable heavy hover transforms on touch devices */
        @media (hover: none) {
            .hover-neon-glow:hover {
                transform: none;
                animation: none;
            }
            .service-card-glow:hover {
                transform: none;
            }
        }

        /* Mobile tap target minimum size */
        @media (max-width: 640px) {
            button, a {
                min-height: 44px;
            }
        }

        /* ================================================================
           2050-READY DESIGN SYSTEM
           ================================================================ */

        /* --- Custom Cursor (desktop only) --- */
        @media (hover: hover) and (pointer: fine) {
            * { cursor: none !important; }
        }
        #cursor-dot {
            display: none;
            width: 8px; height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,196,154,0.4);
        }
        #cursor-ring {
            display: none;
            width: 36px; height: 36px;
            border: 1.5px solid rgba(0,196,154,0.5);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none; z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.35s cubic-bezier(0.23,1,0.32,1),
                        height 0.35s cubic-bezier(0.23,1,0.32,1),
                        border-color 0.35s;
        }
        body:has(a:hover, button:hover) #cursor-dot {
            width: 14px; height: 14px;
            background: var(--violet);
            box-shadow: 0 0 20px var(--violet), 0 0 40px rgba(139,92,246,0.4);
        }
        body:has(a:hover, button:hover) #cursor-ring {
            width: 56px; height: 56px;
            border-color: rgba(139,92,246,0.5);
        }
        @media (hover: none) {
            #cursor-dot, #cursor-ring { display: none; }
        }

        /* --- Scroll Progress Bar --- */
        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 1px; z-index: 9998;
            background: rgba(15,23,42,0.65);
            width: 0%; transition: width 0.1s linear;
            box-shadow: none;
        }

        /* --- Grain / Noise Texture Overlay --- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9997;
            opacity: 0.012;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* --- Aurora / Mesh Gradient Background --- */
        #aurora {
            display: none;
        }
        #aurora::before {
            content: '';
            position: absolute;
            width: 80vw; height: 80vh;
            top: -20%; left: -20%;
            background: radial-gradient(ellipse, rgba(0,196,154,0.06) 0%, transparent 70%);
            animation: aurora-1 18s ease-in-out infinite alternate;
        }
        #aurora::after {
            content: '';
            position: absolute;
            width: 70vw; height: 70vh;
            bottom: -20%; right: -20%;
            background: radial-gradient(ellipse, rgba(139,92,246,0.07) 0%, transparent 70%);
            animation: aurora-2 22s ease-in-out infinite alternate;
        }
        @keyframes aurora-1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10%, 8%) scale(1.1); }
            100% { transform: translate(-5%, 15%) scale(0.95); }
        }
        @keyframes aurora-2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-8%, -10%) scale(1.08); }
            100% { transform: translate(12%, -5%) scale(1.02); }
        }

        /* --- Enhanced Glassmorphism --- */
        .glass {
            background:
                linear-gradient(150deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.015) 100%),
                radial-gradient(150% 130% at 0% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0) 75%),
                var(--glass-bg);
            backdrop-filter: blur(22px) saturate(175%);
            -webkit-backdrop-filter: blur(22px) saturate(175%);
            border: 1px solid rgba(255,255,255,0.20);
            box-shadow: 0 14px 44px rgba(10, 15, 30, 0.18),
                        inset 0 1px 0 rgba(255,255,255,0.40),
                        inset 0 -1px 0 rgba(255,255,255,0.07);
        }
        [data-theme="light"] .glass {
            background:
                linear-gradient(155deg, rgba(255,255,255,0.84) 0%, rgba(249,250,252,0.72) 50%, rgba(240,243,248,0.64) 100%);
            border: 1px solid rgba(255,255,255,0.70);
            box-shadow: 0 14px 40px rgba(15,23,42,0.10), inset 0 1px 0 rgba(255,255,255,0.88);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
        }
        [data-theme="dark"] .glass {
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 16px 42px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
        }

        /* --- 3D Card Tilt, JS-driven via CSS vars --- */
        .tilt-card {
            transform-style: preserve-3d;
            transform: perspective(1000px)
                rotateX(calc(var(--tilt-x, 0) * 1deg))
                rotateY(calc(var(--tilt-y, 0) * 1deg));
            transition: transform 0.15s ease;
            will-change: transform;
        }
        .tilt-card:not(:hover) {
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.5s ease;
        }

        /* --- Holographic gradient text variant --- */
        .text-holo {
            background: linear-gradient(180deg, var(--text) 0%, var(--text-muted) 100%);
            background-size: 100% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: none;
        }

        /* --- Magnetic button effect (applied via JS) --- */
        .btn-magnetic { transition: transform 0.3s cubic-bezier(0.23,1,0.32,1); }

        /* --- Marquee scroll animation --- */
        @keyframes marquee-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-33.333%); }
        }

        /* --- Bento grid helper --- */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .bento-grid-2 { grid-column: span 2; }
        @media (max-width: 768px) { .bento-grid-2 { grid-column: span 1; } }

        /* --- Animated border gradient, used on featured cards --- */
        .border-gradient-animated::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            background-size: 300% 300%;
            animation: holo-shift 4s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box,
                          linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        /* --- Floating badge pulse --- */
        @keyframes float-badge {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-badge { animation: float-badge 3s ease-in-out infinite; }

        /* --- Neural network dot background --- */
        .neural-bg {
            background-image:
                radial-gradient(circle, rgba(0,196,154,0.15) 1px, transparent 1px),
                radial-gradient(circle, rgba(139,92,246,0.1) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 25px;
        }

        /* --- Shimmer skeleton loader --- */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg,
                rgba(255,255,255,0.03) 25%,
                rgba(255,255,255,0.08) 50%,
                rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* --- Highlight text accent --- */
        .highlight-cyan {
            position: relative;
            display: inline;
        }
        .highlight-cyan::after {
            content: '';
            position: absolute;
            bottom: 2px; left: 0; right: 0;
            height: 30%;
            background: rgba(0,196,154,0.2);
            border-radius: 2px;
            z-index: -1;
        }
        /* ── Skip-to-main-content (WCAG 2.1 AA) ──────────────────────────────── */
        .skip-link {
            position: absolute;
            top: -999px;
            left: 0;
            padding: 0.75rem 1.25rem;
            background: #00C49A;
            color: #000;
            font-weight: 700;
            font-size: 0.875rem;
            z-index: 9999;
            border-radius: 0 0 0.5rem 0;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* ── Premium Design System Additions ─────────────────────────────── */

        /* Unified section label chip — inline-flex, cyan brand color, no variants */
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(15,23,42,0.1);
            background: rgba(15,23,42,0.03);
            color: var(--text);
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        /* Card hover — consistent lift across all feature/service cards */
        .card-lift {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease,
                        border-color 0.3s ease;
        }
        .card-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 42px rgba(15, 23, 42, 0.10);
            border-color: rgba(15,23,42,0.14) !important;
        }
        [data-theme="dark"] .card-lift:hover {
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.5);
        }
        @media (hover: none) {
            .card-lift:hover {
                transform: none;
                box-shadow: none;
            }
        }

        /* Respect motion sensitivity preferences */
        @media (prefers-reduced-motion: reduce) {
            html:focus-within {
                scroll-behavior: auto;
            }

            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            #cursor-dot,
            #cursor-ring,
            #scroll-progress,
            #aurora {
                display: none !important;
            }

            .reveal {
                opacity: 1 !important;
                transform: none !important;
            }

            .hover-neon-glow:hover,
            .service-card-glow:hover,
            .micro-lift-card:hover,
            .premium-button:hover,
            .premium-button-secondary:hover {
                transform: none !important;
                animation: none !important;
                box-shadow: none !important;
            }

            .choreo-line-fill {
                transform: none !important;
            }
        }
    </style>
<!-- Vite bundles all dependencies, no browser importmap needed -->

</head>
<body>
    <!-- Skip to main content, visible on keyboard focus for screen reader / keyboard users (WCAG 2.1 AA) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- 2050-ready UI, aurora + cursor + scroll progress overlays -->
    <div id="aurora" aria-hidden="true">
      <div style="position:absolute;width:55vw;height:55vh;top:45%;left:35%;background:radial-gradient(ellipse,rgba(217,70,239,0.05) 0%,transparent 70%);animation:aurora-2 26s ease-in-out infinite alternate-reverse;pointer-events:none"></div>
    </div>
    <div id="scroll-progress" aria-hidden="true"></div>
    <div id="cursor-dot" aria-hidden="true"></div>
    <div id="cursor-ring" aria-hidden="true"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script src="/ui-init.js" defer></script>
</body>
</html>
