<!DOCTYPE html>
<html lang="en-CA" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>TrivianEdge | Global Operations &amp; Offshore Talent Partner</title>
    <meta name="description" content="TrivianEdge helps companies build offshore teams, run global operations, and move faster with a cleaner operating model. Teams typically live in around 30 days.">
    <meta name="keywords" content="global operations, offshore talent, BPO Canada, business process outsourcing, offshore software development, IT outsourcing, talent deployment, managed remote teams, TrivianEdge">
    <meta name="author" content="TrivianEdge Global">
    <meta name="application-name" content="TrivianEdge">
    <meta name="theme-color" content="#000000">
    <meta name="rating" content="general">
    <meta name="revisit-after" content="1 day">
    <meta name="language" content="English">
    <meta name="classification" content="Business, Technology, Outsourcing">
    <meta name="category" content="BPO, Software Development, Outsourcing, Offshore Teams">
    <meta name="coverage" content="Worldwide">
    <meta name="target" content="all">

    <!-- Robots directives for all major engines -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large">

    <!-- IndexNow verification for Bing Webmaster Tools -->
    <meta name="indexnow-verification" content="b60b3c2124cf4a91828dc2e07ce295aa">

    <!-- Canonical and hreflang are intentionally omitted here: SEOHead
         (react-helmet-async) injects the correct per-route canonical, and the
         home route injects its own hreflang set, once React mounts. Static
         tags here would always point at "/" and duplicate/conflict with those
         on every route (including "/" itself, since SEOHead adds them too). -->

    <!-- Geo tags, important for "BPO Canada" and "outsourcing Canada" queries -->
    <meta name="geo.region" content="CA-ON">
    <meta name="geo.placename" content="Toronto, Ontario, Canada">
    <meta name="geo.position" content="43.7731;-79.2386">
    <meta name="ICBM" content="43.7731, -79.2386">

    <!-- Dublin Core -->
    <meta name="DC.title" content="TrivianEdge | Global Operations &amp; Offshore Talent Partner">
    <meta name="DC.description" content="TrivianEdge helps companies build offshore teams and run global operations with less friction.">
    <meta name="DC.subject" content="BPO, RPO, Bespoke Software Development, Outsourcing, Offshore Software Development, IT Outsourcing">
    <meta name="DC.type" content="Service">
    <meta name="DC.language" content="en-CA">

    <!-- Open Graph -->
    <meta property="og:title" content="TrivianEdge | Global Operations &amp; Offshore Talent Partner">
    <meta property="og:description" content="TrivianEdge helps companies build offshore teams, run global operations, and move faster with a cleaner operating model.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.trivianedge.com/">
    <meta property="og:image" content="https://www.trivianedge.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TrivianEdge | BPO and Offshore Software Development Company Canada">
    <meta property="og:site_name" content="TrivianEdge">
    <meta property="og:locale" content="en_CA">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@TrivianEdge">
    <meta name="twitter:creator" content="@TrivianEdge">
    <meta name="twitter:title" content="TrivianEdge | Global Operations &amp; Offshore Talent Partner">
    <meta name="twitter:description" content="TrivianEdge helps companies build offshore teams, run global operations, and move faster with a cleaner operating model.">
    <meta name="twitter:image" content="https://www.trivianedge.com/og-image.png">
    <meta name="twitter:image:alt" content="TrivianEdge BPO and Offshore Development">

    <!-- LinkedIn specific -->
    <meta property="og:image:secure_url" content="https://www.trivianedge.com/og-image.png">

    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- CSP: 'unsafe-inline' in script-src is required for JSON-LD structured-data injected by react-helmet-async -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://static.cloudflareinsights.com https://*.clarity.ms https://widget.trustpilot.com; connect-src 'self' https://api.open-meteo.com https://api.resend.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com https://cloudflareinsights.com https://*.clarity.ms https://widget.trustpilot.com; frame-src https://widget.trustpilot.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; worker-src 'self' blob:;">

    <link rel="preconnect" href="https://flagcdn.com" crossorigin>

    <!-- Self-hosted variable fonts (public/fonts, SIL OFL). Preloading the two
         Latin files gets them in before first paint in most loads, so the
         font swap (previously 0.25 CLS from Google Fonts arriving late)
         usually never happens; metric-matched fallbacks in src/theme.css
         cover the rest. Latin-ext files load on demand via unicode-range. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- critical-loader.js swaps deferred (media="print") stylesheets to
         media="all" once loaded. Deferred so every target <link> exists
         when it runs; see that file for why it's external. -->
    <script src="/critical-loader.js" defer></script>

<!-- Vite bundles all dependencies, no browser importmap needed -->

    <!-- Meta Pixel Code (public/meta-pixel.js) is no longer loaded statically here.
         src/cookieConsent.ts injects it dynamically, only once the visitor has
         granted marketing consent through the cookie banner -- see that file.
         The <noscript> fallback still lives in <body> below for no-JS visitors,
         who can't run the consent banner either way. -->

    <!-- Microsoft Clarity is initialized from index.tsx, deferred via
         requestIdleCallback the same way as GA4 and Amplitude below, instead
         of running eagerly here at head-parse time. -->

    
</head>
<body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1763614258308992&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
    <!-- Skip to main content, visible on keyboard focus for screen reader / keyboard users (WCAG 2.1 AA) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>


    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script src="/ui-init.js" defer></script>
</body>
</html>
